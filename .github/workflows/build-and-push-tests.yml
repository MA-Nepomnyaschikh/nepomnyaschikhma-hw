name: Build and Push Tests

on:
  push:
    paths:
      - "src/**"

  workflow_dispatch:

jobs:
  verify:
    name: Build, Test and Checkstyle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Set up services
        run: bash infra/docker_compose/restart_nbank_with_update_images.sh

      - name: Build
        run: ./mvnw clean package
        env:
          APIBASEURL: http://localhost:4111
          UIBASEURL: http://frontend
          APIVERSION: /api/v1

      - name: Tear down services
        if: always()
        run: bash infra/docker_compose/stop_nbank.sh

      - name: Checkstyle
        run: ./mvnw checkstyle:check

  publish-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/nbank-tests:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/nbank-tests:${{ github.sha }}
